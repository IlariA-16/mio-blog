<header class="main-navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-logo">
      <span class="text-gradient">Ilaria Taddei</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{exact: true}" 
         class="nav-link">
         {{ 'HOME_LINK' | translate }}
      </a>

      <a routerLink="/blog" 
         routerLinkActive="active" 
         class="nav-link">
         {{ 'BLOG_LINK' | translate }}
      </a>

      <a routerLink="/about" 
         routerLinkActive="active" 
         class="nav-link">
         {{ 'CHI_SONO_LINK' | translate }}
      </a>

      <a routerLink="/contatti" 
         routerLinkActive="active" 
         class="nav-link">
         {{ 'CONTATTI_LINK' | translate }}
      </a>

      <div class="lang-switch">
        <button (click)="switchLanguage('it')" class="lang-btn">IT</button>
        <span class="lang-divider">/</span>
        <button (click)="switchLanguage('en')" class="lang-btn">EN</button>
      </div>
    </nav>
  </div>
</header>
